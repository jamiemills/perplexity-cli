# Gitleaks configuration for perplexity-cli
# Schema version: 8.30.1
#
# Extends the default gitleaks rule set with project-specific path and
# rule exceptions.  Every allow is documented with owner / path / reason
# so future maintainers can audit each exception in isolation.
#
# See https://github.com/gitleaks/gitleaks#configuration for reference.

title = "perplexity-cli gitleaks config"

# ---------------------------------------------------------------------------
# Inherit all built-in rules (G001 – Gxxx)
# ---------------------------------------------------------------------------
[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist — project-specific exceptions
#
# Policy: no global semantic word allowlists.  Every exception is either
# path-scoped (tests / fixtures) or rule-specific with a documented reason.
# ---------------------------------------------------------------------------
[allowlist]
description = "Project-specific false-positive allowlist – audited per entry"

# ---- Exact per-file exceptions ---------------------------------------------
# Policy: NO directory-level allowlists (the blanket tests/ rule is removed
# so a real credential committed under tests/ is always detected).  Every
# entry below names ONE exact file, documented with owner + reason.
#
# 1. tests/fixtures/gitleaks/secret-repo-setup.sh
#      Rules: generic-api-key
#      Owner: jamie.mills@gmail.com (project maintainer)
#      Reason: fixture script writes a synthetic AWS key pair into a
#      throwaway temp repo so integration tests can assert exit-code 10
#      deterministically.  Deliberately non-secret test data.
# 2. tests/fixtures/gitleaks/secrets_test_data.txt
#      Rules: github-pat, private-key
#      Owner: jamie.mills@gmail.com (project maintainer)
#      Reason: synthetic GitHub PAT + PEM sample strings used to document
#      gitleaks built-in rule patterns for the integration suite.
#      Deliberately non-secret test data.
# 3. tests/test_gitleaks_integration.py
#      Rules: generic-api-key, github-pat, private-key
#      Owner: jamie.mills@gmail.com (project maintainer)
#      Reason: historical committed content predating T004 assembled the
#      detector strings as module-level literals.  The file now builds those
#      strings at runtime, but the old committed blobs still match, so the
#      full-history scan needs this exact path exemption.
# 4. tests/test_gitleaks_prepush.py
#      Rules: generic-api-key
#      Owner: jamie.mills@gmail.com (project maintainer)
#      Reason: the merge-resolution test historically committed a synthetic
#      API secret literal; it is now assembled at runtime.  The old committed
#      blobs still match, so the full-history scan needs this exact path
#      exemption.
paths = [
  '''^tests/fixtures/gitleaks/secret-repo-setup\.sh$''',
  '''^tests/fixtures/gitleaks/secrets_test_data\.txt$''',
  '''^tests/test_gitleaks_integration\.py$''',
  '''^tests/test_gitleaks_prepush\.py$''',
]

# ---- Stopword exceptions ----------------------------------------------------
# Owner: jamie.mills@gmail.com (project maintainer)
#
# Reason: mutmut auto-generates function names with the ``__mutmut_`` infix
# (e.g. ``x__derive_encryption_key__mutmut_6``).  These identifiers contain
# high-entropy substrings that can match generic-api-key patterns, but they
# are mechanically-produced mutation suffixes — never secrets.
stopwords = [
  '''__mutmut_''',
]
