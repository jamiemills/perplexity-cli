[[property]]
node_id = "tests/test_property.py::test_classify_exception_maps_http_status_errors"
oracle_type = "classification-invariant"
rationale = "Recognised HTTP status codes map to their designated envelope error codes."

[[property]]
node_id = "tests/test_property.py::test_classify_exception_unmapped_http_status_defaults_to_network_error"
oracle_type = "fallback-invariant"
