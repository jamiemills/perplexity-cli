[[property]]
node_id = "tests/test_property.py::test_require_mapping_raises_on_non_dict"
oracle_type = "contract-invariant"
rationale = "Mappings pass through unchanged and every generated non-mapping is rejected."

[[property]]
node_id = "tests/test_property.py::test_require_list_raises_on_non_list"
oracle_type = "contract-invariant"
rationale = "Lists pass through unchanged and every generated non-list is rejected."

[[property]]
node_id = "tests/test_property.py::test_describe_payload_shape_never_crashes"
