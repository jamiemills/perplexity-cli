# Exact manifest of supported top-level Hypothesis property tests.
# Rationale fields are human-reviewed semantics, not source-derived facts.

schema_version = 1

# Encryption

[[property]]
node_id = "tests/test_property.py::test_encrypt_decrypt_roundtrip"
oracle_type = "round-trip-and-output-invariant"
rationale = "Decryption restores the token, while non-empty plaintext is not returned as ciphertext."

[[property]]
node_id = "tests/test_property.py::test_encrypt_produces_different_ciphertexts"
oracle_type = "non-determinism-invariant"
rationale = "Two encryptions of the same token produce different ciphertexts."

# Envelopes

[[property]]
node_id = "tests/test_property.py::test_success_envelope_roundtrip"
oracle_type = "round-trip-invariant"
rationale = "JSON serialisation preserves success-envelope fields and nested values."

[[property]]
node_id = "tests/test_property.py::test_error_envelope_roundtrip"
oracle_type = "round-trip-invariant"
rationale = "JSON serialisation preserves error-envelope status, detail, fix, and actions."

[[property]]
node_id = "tests/test_property.py::test_success_envelope_builder_always_ok"
oracle_type = "builder-invariant"
rationale = "The success builder always sets ok and preserves its command and result."

[[property]]
node_id = "tests/test_property.py::test_error_envelope_builder_always_not_ok"
oracle_type = "builder-invariant"
rationale = "The error builder always clears ok and preserves its command and message."

[[property]]
node_id = "tests/test_property.py::test_envelope_to_dict_schema_toggle_excludes_schema"
oracle_type = "toggle-invariant"
rationale = "The no-schema mode omits the schema while preserving success fields."

[[property]]
node_id = "tests/test_property.py::test_envelope_to_dict_schema_toggle_includes_schema"
oracle_type = "toggle-invariant"
rationale = "The with-schema mode includes the envelope model schema."

