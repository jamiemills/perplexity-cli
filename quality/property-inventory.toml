[[property]]
node_id = "tests/test_property.py::test_is_in_date_range_same_day_range_inclusive"
oracle_type = "boundary-invariant"
rationale = "A same-day range includes every instant on that day."

[[property]]
node_id = "tests/test_property.py::test_date_parser_roundtrip_iso"
oracle_type = "parser-invariant"
rationale = "Parsing generated ISO components recovers the represented date and minute."

[[property]]
node_id = "tests/test_property.py::test_date_parser_handles_formatted_dates"
oracle_type = "parser-invariant"
rationale = "Parsing the supported human-readable format recovers the represented instant."

