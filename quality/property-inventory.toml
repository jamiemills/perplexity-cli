# Date handling

[[property]]
node_id = "tests/test_property.py::test_to_iso8601_always_z_suffix"
oracle_type = "format-invariant"
rationale = "UTC datetimes are emitted with the canonical Z suffix."

[[property]]
node_id = "tests/test_property.py::test_to_iso8601_parseable_utc_roundtrip"
oracle_type = "computational-round-trip"
rationale = "Parsing emitted ISO text preserves the original UTC instant."

[[property]]
node_id = "tests/test_property.py::test_to_iso8601_order_preserving"
oracle_type = "monotonicity-invariant"
rationale = "Lexicographic order of emitted UTC timestamps follows chronological order."

[[property]]
node_id = "tests/test_property.py::test_is_in_date_range_unbounded_always_true"
