# Retry behaviour

[[property]]
node_id = "tests/test_property.py::test_backoff_delay_never_exceeds_max"
oracle_type = "boundedness-invariant"
rationale = "Backoff delay never exceeds its configured maximum."

[[property]]
node_id = "tests/test_property.py::test_backoff_delay_increases_with_attempts"
oracle_type = "monotonicity-invariant"
rationale = "Successive backoff attempts do not reduce delay before or at the cap."

[[property]]
node_id = "tests/test_property.py::test_is_retryable_error_only_for_5xx_and_429"
oracle_type = "classification-invariant"
rationale = "Only server errors and rate limiting are classified as retryable."

[[property]]
node_id = "tests/test_property.py::test_backoff_delay_non_negative"
oracle_type = "boundedness-invariant"
rationale = "Backoff delay remains non-negative across supported jitter values."

[[property]]
node_id = "tests/test_property.py::test_backoff_delay_monotonic_without_jitter"
oracle_type = "monotonicity-invariant"
rationale = "Without jitter, successive attempts have non-decreasing delays."

[[property]]
node_id = "tests/test_property.py::test_backoff_delay_within_jitter_bounds"
oracle_type = "boundedness-invariant"
rationale = "Jittered delays remain between zero and the configured maximum."

[[property]]
node_id = "tests/test_property.py::test_get_retry_after_delay_none_for_non_http_error"
oracle_type = "type-dispatch-invariant"
rationale = "Non-HTTP exceptions do not produce Retry-After delays."

[[property]]
node_id = "tests/test_property.py::test_get_retry_after_delay_handles_both_header_casings"
oracle_type = "case-insensitivity-invariant"
rationale = "Canonical and lowercase Retry-After headers produce the same delay."

[[property]]
node_id = "tests/test_property.py::test_get_retry_after_delay_clamps_negative"
oracle_type = "clamping-invariant"
rationale = "Negative Retry-After values are clamped to zero."

# Thread cache

[[property]]
node_id = "tests/test_property.py::test_merge_threads_no_duplicate_urls"
oracle_type = "uniqueness-invariant"
rationale = "Merging inputs with internally unique URLs produces no duplicate URL."

[[property]]
node_id = "tests/test_property.py::test_merge_threads_sorted_newest_first"
oracle_type = "ordering-invariant"
rationale = "Merged threads are ordered by creation timestamp from newest to oldest."

[[property]]
node_id = "tests/test_property.py::test_merge_threads_cached_record_preferred_on_duplicate"
oracle_type = "precedence-invariant"
rationale = "A cached record wins when a new record has the same URL."

[[property]]
node_id = "tests/test_property.py::test_merge_threads_idempotent"
oracle_type = "idempotence-invariant"
rationale = "Merging an already merged result with an empty list changes nothing."

[[property]]
node_id = "tests/test_property.py::test_merge_threads_empty_lists_merge_to_empty"
oracle_type = "superset-invariant"
rationale = "Despite its historical name, the current property proves every cached URL remains in the merge."

[[property]]
node_id = "tests/test_property.py::test_calculate_fetch_range_inside_coverage_returns_none"
oracle_type = "coverage-boundary-invariant"
rationale = "A request fully covered by cache requires no additional fetch range."

[[property]]
node_id = "tests/test_property.py::test_calculate_fetch_range_fetch_bounds_within_request"
oracle_type = "boundedness-invariant"
rationale = "A required fetch range stays within the requested date bounds."

