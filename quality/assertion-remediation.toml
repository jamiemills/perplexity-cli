# ---------------------------------------------------------------------------
# Generic "ERROR" disjunction
# ---------------------------------------------------------------------------

[[assertions.broad]]
file = "tests/test_model_runner.py"
line = 373
original = 'assert "error" in captured.err.lower() or "ERROR" in captured.err'
strategy = "replace-logically-weak-disjunction"
replacement = 'assert "error" in captured.err.lower()'
reason = "The lower() call already normalises case, so the uppercase 'ERROR' branch is dead code. The check specifically tests the stderr output path."

# ---------------------------------------------------------------------------
# Weak disjunction — Rich table vs fallback
# ---------------------------------------------------------------------------

[[assertions.broad]]
file = "tests/test_cli.py"
line = 320
original = 'assert "Wikipedia" in result.output or "#" in result.output  # References table'
strategy = "replace-logically-weak-disjunction"
replacement = """
assert "Wikipedia" in result.output
assert "#" in result.output  # Reference numbering
"""
reason = "Splitting the disjunction into two independent assertions ensures both the reference content and the rendering format (numbered references) are present. The original disjunction could silently degrade by asserting only one of two disjoint conditions."

