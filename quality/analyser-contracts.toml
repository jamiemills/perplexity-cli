# =============================================================================
# quality/analyser-contracts.toml — stable inventory of quality analysers.
#
# Each analyser declares its canonical Make target, the phases it belongs to,
# and the expected process-exit behaviour for every known outcome state.
#
# Contracts are used by scripts/check_analyser_contracts.py to verify that
# analysers behave as expected (exit codes, signals) when invoked through
# their canonical target.
#
# Schema: [[analysers]] array with id, target, phase, status, description,
#         and [analysers.states.<state>] tables declaring exit_min, exit_max,
#         and optional signal.
# =============================================================================

[schema]
version = 1

# ---------------------------------------------------------------------------
# Phase 1 — Basic static analysis (format, lint, typecheck, security, dead-code)
# ---------------------------------------------------------------------------

[[analysers]]
id = "format-check"
target = "format-check"
phase = 1
status = "active"
description = "Code formatting verification via ruff format --check"

[analysers.states.clean]
exit_min = 0
exit_max = 0

[analysers.states.findings]
exit_min = 1
exit_max = 1

[[analysers]]
id = "lint"
target = "lint"
phase = 1
status = "active"
description = "Lint violations via ruff check"

