[[analysers]]
id = "semgrep"
target = "semgrep"
phase = 1
status = "active"
description = "Immutable blocking Semgrep ruleset"
test_node_ids = [
    "tests/test_semgrep_clean_code.py",
    "tests/test_semgrep_policy.py",
    "tests/test_semgrep_wrapper.py",
]

[analysers.states.clean]
exit_min = 0
exit_max = 0

[analysers.states.findings]
exit_min = 1
exit_max = 1

# Semgrep itself may time out per-rule (exit 3) or be killed by the runner
# (SIGTERM). The schema models a single dominant case here; the runner kills
# the process with SIGTERM on subprocess.TimeoutExpired.
[analysers.states.timeout]
exit_min = -1
exit_max = -1
signal = "SIGTERM"

[analysers.states.internal-error]
exit_min = 5
exit_max = 5

