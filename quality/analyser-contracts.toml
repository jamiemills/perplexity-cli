# =============================================================================
# quality/analyser-contracts.toml — stable inventory of quality analysers.
#
# This schema-v1 file is a curated process-outcome registry, not an exhaustive
# inventory of repository quality wiring. Each analyser declares its canonical
# Make target and expected process-exit behaviour for known outcome states.
# `phase` is documentation grouping, `status` controls contract-runner
# selection only, and `test_node_ids` are executable evidence references.
# States model expected process behaviour (exit ranges); they do not alone
# constitute a quality pass. Every ACTIVE analyser MUST therefore declare at
# least one test_node_ids entry, and validation fails closed when it does not.
#
# Contracts are used by scripts/check_analyser_contracts.py to verify that
# analysers behave as expected (exit codes, signals) when invoked through
# their canonical target.
#
# Schema: [[analysers]] array with id, target, phase, status, description,
#         optional test_node_ids, and [analysers.states.<state>] tables
#         declaring exit_min, exit_max, and optional signal.
# =============================================================================

[schema]
version = 1

# ---------------------------------------------------------------------------
# Phase 1 — Basic static analysis (format, lint, typecheck, security, dead-code)
# ---------------------------------------------------------------------------

[[analysers]]
id = "format-check"
target = "format-check"
phase = 1
status = "active"
description = "Code formatting verification via ruff format --check"
test_node_ids = [
    "tests/test_analyser_contracts.py::test_active_analyser_tool_clean_and_findings_exit_ranges[format-check]",
]

[analysers.states.clean]
exit_min = 0
exit_max = 0

[analysers.states.findings]
exit_min = 1
exit_max = 1

