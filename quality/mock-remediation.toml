# =============================================================================
# quality/mock-remediation.toml — inventory of mock stacks with 3+ patches
# and their reduction strategies.
#
# Wave 5B, Ranks 13 & 14 — Reduce mock stacks in CLI/runner tests.
# =============================================================================

[metadata]
wave = "5B"
ranks = [13, 14]
head_commit = "adf4a74a3376b4e939fc555a086d8a836dfa8f26"
created = "2026-07-26"

# ---------------------------------------------------------------------------
# Strategy summary
# ---------------------------------------------------------------------------
#
# For mock stacks with 3+ patches, the following strategies were applied:
#
# 1. AUTOSPEC — Add autospec=True to @patch / patch() calls so that
#    interface drift in production code is caught at test time.
#
# 2. CONSOLIDATE — Extract repeated mock-stack patterns into shared
#    test-module helpers when the same stack appears 3+ times.
#
# 3. SPEC_SET — Use spec_set=True on standalone Mock() instances to
#    prevent attribute typos going unnoticed.
#
# 4. ASSERT-CALLED — Replace manual call_args inspection with
#    assert_called_once_with() / assert_called_with() for precise
#    verification.
#
# 5. FIXTURES — Where practical without modifying conftest.py, extract
#    mock setup into test-class methods so the @patch decorator lists
#    shrink.
# ---------------------------------------------------------------------------

