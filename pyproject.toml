[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pxcli"
version = "0.7.1"
description = "CLI for Perplexity.ai with persistent authentication, encrypted tokens, streaming responses, multiple output formats, source references, thread export with date filtering, configurable URLs, logging, and automatic retry logic"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Jamie Mills", email = "jamie.mills@gmail.com"},
]
keywords = ["cli", "perplexity", "ai", "query", "command-line"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0",
    "cryptography>=48.0.1",
    "curl-cffi>=0.15.0",
    "httpx>=0.25",
    "mcp>=1.28.1,<2.0.0",
    "websockets>=12.0",
    "rich>=13.0",
    "tenacity>=8.0",
    "python-dateutil>=2.8.0",
    "pydantic>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.1",
    "refurb>=2.0",
    "ty>=0.0.24",
    "lefthook>=2.1.6",
    "bandit>=1.7.7",
    "vulture>=2.14",
    "diff-cover>=9.0",
]

[project.urls]
Homepage = "https://github.com/jamiemills/perplexity-cli"
Repository = "https://github.com/jamiemills/perplexity-cli"
"Bug Tracker" = "https://github.com/jamiemills/perplexity-cli/issues"
"Source Code" = "https://github.com/jamiemills/perplexity-cli"

[project.scripts]
pxcli = "perplexity_cli.cli:main"
perplexity-cli = "perplexity_cli.cli:main"
pxcli-mcp = "perplexity_cli.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
perplexity_cli = ["resources/skill.md", "config/urls.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures/"]

[tool.ruff.format]
docstring-code-format = true
exclude = ["tests/fixtures/"]

[tool.ruff.lint]
select = [
    "E",     "W",     "F",     "I",
    "C4",    "B",     "UP",    "D",
    "S101",  "T10",   "RUF",
    "C90",   "PL",    "ARG",   "RET",
    "SIM",   "BLE",   "FBT",   "TRY",
    "T20",   "ERA",   "PTH",   "PERF",
]
ignore = [
    "E501",    "D105",   "D107",   "D301",
    "PLC0415",
    "TRY003",  "EM101",  "EM102",
    "G004",    "G201",
    "FBT001",  "FBT002",  "FBT003",
    "TRY004",  "TRY300",  "TRY301",  "TRY401",
    "BLE001",
    "PTH123",  "PTH101",
    "PERF401", "PERF403",
    "PLR0911", "PLR0912",  "PLR0915",
    "PLR0133", "PLW2901",  "PLE0704",
    "SIM108",
    "ARG004",
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 5
max-returns = 4
max-statements = 30
max-nested-blocks = 3

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D", "S101", "PLR2004",
    "T201","SIM117","SIM118","SIM105","SIM101",
    "ARG001","ARG002","ARG005",
    "PLW1510","PLR0913","C901",
    "ERA001",
    "PTH100","PTH118","PTH120","PLW0108","PLR1722",
    "RUF059","RET504","RUF003","B011","F841","F821",
]
"tests/fixtures/**/*.py" = ["ALL"]
"vulture_whitelist.py" = ["B018", "D", "F821"]
"scripts/**/*.py" = ["D", "T20", "FBT", "PLC0415", "PLR0911", "PLR0912", "BLE001", "SIM108", "ARG004", "PLE0704", "PLR0133", "PLW2901"]
"src/**/*.py" = ["FBT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = '--strict-markers -v'
asyncio_default_fixture_loop_scope = "function"
strict_config = true
strict_xfail = true
markers = [
    "hermetic_integration: marks tests as hermetic integration tests (loopback only, no real network)",
    "security: marks tests as security tests",
    "slow: marks tests as slow-running",
    "real_api: marks tests that call the real Perplexity API (skipped in CI)",
    "manual: marks tests that require interactive input (run with pytest -m manual -s)",
    "real_user_config: marks tests that intentionally use the real user config directory",
    "fuzz: marks tests as atheris fuzz tests (cpu-intensive, ~2-3s each)",
    "property: marks tests as Hypothesis property-based tests",
]

[tool.coverage.run]
source = ["perplexity_cli"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests"]

[tool.vulture]
paths = ["src/"]
exclude = []
min_confidence = 80

[tool.mutmut]
paths_to_mutate = ["src/perplexity_cli/"]
tests_dir = ["tests/"]
pytest_add_cli_args = ["-m", "not property and not real_api and not manual and not fuzz and not hermetic_integration", "--ignore=tests/test_cyclomatic_complexity.py", "--ignore=tests/test_test_isolation.py", "--ignore=tests/test_vulture_dead_code.py", "--ignore=tests/test_semgrep_clean_code.py", "--ignore=tests/test_coupling_metrics.py", "--ignore=tests/test_safety_scan.py", "--ignore=tests/test_mutate_diff_files.py", "--ignore=tests/test_plan_compliance.py", "--ignore=tests/test_quality_ratchets.py", "--ignore=tests/test_schema_drift.py", "--ignore=tests/test_repository_hygiene.py", "--ignore=tests/test_help_doc_drift.py", "--ignore=tests/test_module_coverage.py", "--ignore=tests/test_quality_pipeline_configuration.py", "--ignore=tests/test_workflow_configuration.py", "--ignore=tests/test_agent_check_edge_cases.py", "--ignore=tests/test_architecture.py", "--ignore=tests/test_architecture_model.py", "--ignore=tests/test_coverage_policy.py", "--ignore=tests/test_differential_context.py", "--ignore=tests/test_dynamic_imports.py", "--ignore=tests/test_import_graph.py", "--ignore=tests/test_semgrep_wrapper.py", "--ignore=tests/test_make_policy.py", "--ignore=tests/test_workflow_policy.py", "--ignore=tests/test_analyser_contracts.py", "--ignore=tests/test_mutation_policy.py", "--ignore=tests/test_suppressions.py"]
do_not_mutate = []

[tool.pyright]
include = ["src/"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportImportCycles = "warning"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.deptry]
extend_exclude = ["vulture_whitelist\\.py"]
known_first_party = ["scripts"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "radon>=6.0.1",
    "vulture>=2.16",
    "mutmut>=3.0",
    "hypothesis>=6.0",
    "pytest-xdist>=3.0",
    "deptry>=0.20",
    "pip-audit>=2.7",
    "import-linter>=2.0",
    "ruamel.yaml>=0.18",
    "tomli>=2.0",
    "grimp>=3.0",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "diff-cover",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "ty",
    "lefthook",
    "bandit",
    "vulture",
    "refurb",
]
DEP004 = [
    "tomli",
    "grimp",
    "ruamel",
]
