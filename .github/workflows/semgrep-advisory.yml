name: Semgrep Advisory

'on':
  schedule:
    - cron: '0 7 * * 2' # Weekly Tuesday 07:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-advisory-${{ github.event_name == 'schedule' && 'scheduled' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  semgrep-advisory:
    name: Latest Community Rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      # The Make target intentionally resolves the latest Semgrep and remote packs,
      # emitting both JSON and SARIF into build/reports/.
      - name: Run latest community advisory rules
        run: make semgrep-advisory-report

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          report="build/reports/semgrep-advisory.json"
          if [ -f "$report" ]; then
            count=$(jq '.results | length' "$report")
          else
            count=0
          fi
          {
            echo "## Semgrep Advisory"
            echo ""
            echo "Findings: **${count}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/semgrep-advisory.json
            build/reports/semgrep-advisory.sarif
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: build/reports/semgrep-advisory.sarif
          category: semgrep-advisory
