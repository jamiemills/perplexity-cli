name: Publish to PyPI

'on':
  push:
    tags:
      - 'v*'

# Required for creating releases and OIDC to PyPI
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate version matches tag and package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Tag version: ${TAG_VERSION}"
          PY_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version']); f.close()")
          echo "pyproject.toml version: ${PY_VERSION}"
          RUNTIME_VERSION=$(PYTHONPATH=src python -c "from perplexity_cli import __version__; print(__version__)")
          echo "runtime version: ${RUNTIME_VERSION}"
          if [ "${TAG_VERSION}" != "${PY_VERSION}" ] || [ "${TAG_VERSION}" != "${RUNTIME_VERSION}" ]; then
            echo "Error: Tag version (${TAG_VERSION}) must match pyproject (${PY_VERSION}) and runtime (${RUNTIME_VERSION})."
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Run CI pipeline
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
        run: make ci-trusted

      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: false
          files: dist/*
