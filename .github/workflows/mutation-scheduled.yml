name: Scheduled Mutation Testing
on:
  schedule:
    - cron: '0 2 * * 0'  # weekly Sunday 2am
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync dependencies
        run: uv sync --all-extras --locked --group dev
      - name: Run full mutation testing
        run: uv run mutmut run
      - name: Show results
        run: uv run mutmut results
        continue-on-error: true
