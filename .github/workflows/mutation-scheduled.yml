name: Scheduled Mutation Testing

'on':
  schedule:
    - cron: '0 2 * * 0' # Weekly Sunday 02:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync --all-extras --locked --group dev

      - name: Run full mutation testing
        run: make mutate

      - name: Show results
        if: always()
        run: make mutate-results
        continue-on-error: true
