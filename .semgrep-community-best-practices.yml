      rule:
        r_id: 9453
        rv_id: 946119
        rule_id: zdUk4Z
        version_id: 0bT15Nn
        url: https://semgrep.dev/playground/r/0bT15Nn/python.django.best-practice.use-onetoonefield.use-onetoonefield
        origin: community
- id: python.lang.correctness.return-in-init.yield-in-init
  patterns:
  - pattern-inside: |
      class $A(...):
          ...
  - pattern-inside: |
      def __init__(...):
          ...
  - pattern-not-inside: |
      def __init__(...):
          ...
          def $F(...):
              ...
  - pattern-either:
    - pattern: yield ...
    - pattern: yield
  message: '`yield` should never appear inside a class __init__ function. This will
    cause a runtime error.'
  languages:
  - python
  severity: ERROR
  metadata:
    category: correctness
    technology:
    - python
    license: Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license
