  - pattern-not-inside: |
      $D = list(...)
      ...
  - pattern-not-inside: |
      $D = copy.deepcopy($D)
      ...
  - pattern-not-inside: |
      $D = copy.copy($D)
      ...
  - pattern-not-inside: |
      $D = list.copy($D)
      ...
  - pattern-not-inside: |
      $D = $D[:]
      ...
  - pattern-not-inside: |
      $D = [... for ... in ...]
      ...
  - pattern-not-inside: |
