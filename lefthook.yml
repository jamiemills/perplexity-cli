# =============================================================================
# Pre-commit: 3-stage pipeline (piped = sequential stages, abort on failure)
#
#   Stage 1  Read-only linters & validators  (parallel, ~4s)
#   Stage 2  Auto-fixers                     (piped,    ~0.7s)
#   Stage 3  Unit tests (no coverage)        (single,   ~21s)
#
# Check commands are defined in the Makefile (single source of truth).
# Staged-file auto-fixers remain here as they need git-specific behaviour.
#
# Fail-fast: a pyright or bandit error aborts in ~2-4s instead of ~24s.
# Coverage enforcement, supply-chain scanning, and fuzz testing run on
# pre-push where per-commit granularity is not needed.
# =============================================================================

pre-commit:
  piped: true
  jobs:
    # -----------------------------------------------------------------
    # Stage 1: read-only linters and validators (parallel)
    #
    # None of these modify files. Running them first gives the fastest
    # possible feedback on real errors that no fixer can address.
    # Commands delegate to Makefile targets for consistency with CI.
    # Wall time: ~4s (semgrep is the bottleneck).
    # -----------------------------------------------------------------
    - name: lint-and-validate
      group:
        parallel: true
        jobs:
          - name: pyright-check
            glob: "*.py"
            run: make typecheck-pyright

          - name: ty-check
            glob: "*.py"
            run: make typecheck

          - name: bandit
            glob: "*.py"
            run: make bandit

          - name: vulture
            glob: "*.py"
            run: make vulture

          - name: radon-cc
            glob: "*.py"
            run: make complexity-cc

          - name: radon-mi
            glob: "*.py"
            run: make complexity-mi

          - name: semgrep
            glob: "*.{py,yml,yaml,ts}"
            run: make semgrep

          - name: opencode-check
            glob: "{.opencode/**/*.ts,.opencode/**/*.json,.opencode/**/*.md,opencode.jsonc}"
            run: make opencode-check

          - name: make-recipe-syntax
            glob: "Makefile"
            run: make -n safety-gate | bash -n

          - name: shell-syntax
            glob: "scripts/*.sh"
            run: bash -n {staged_files}

          - name: workflow-policy
            glob: ".github/workflows/*.{yml,yaml}"
            run: uv run pytest tests/test_workflow_configuration.py -q

          - name: check-yaml
            glob: "*.{yml,yaml}"
            run: uvx --from pre-commit-hooks check-yaml {staged_files}

          - name: check-json
            glob: "*.json"
            run: uvx --from pre-commit-hooks check-json {staged_files}

          - name: check-toml
            glob: "*.toml"
            run: uvx --from pre-commit-hooks check-toml {staged_files}

          - name: check-env-files
            run: |
              env_files=$(git diff --cached --name-only --diff-filter=A | grep -E '(^|/)\.env$')
              if [ -n "$env_files" ]; then
                echo "ERROR: .env files must not be committed — they may contain secrets."
                echo "Blocked files:"
                echo "$env_files" | sed 's/^/  /'
                exit 1
              fi

          - name: check-added-large-files
            run: uvx --from pre-commit-hooks check-added-large-files --maxkb=1000 {staged_files}

          - name: check-merge-conflict
            run: uvx --from pre-commit-hooks check-merge-conflict {staged_files}

          - name: check-case-conflict
            run: uvx --from pre-commit-hooks check-case-conflict {staged_files}

          - name: check-docstring-first
            glob: "*.py"
            run: uvx --from pre-commit-hooks check-docstring-first {staged_files}

          - name: name-tests-test
            glob: "tests/**/*.py"
            run: uvx --from pre-commit-hooks name-tests-test --pytest-test-first {staged_files}

          - name: infisical-scan
            run: make infisical-scan

    # -----------------------------------------------------------------
    # Stage 2: auto-fixers (piped -- sequential to avoid file races)
    #
    # These modify staged files and re-stage the result.  This is
    # git-specific behaviour that cannot be expressed in the Makefile,
    # so commands remain inline here.
    # Wall time: ~0.7s sequential.
    # -----------------------------------------------------------------
    - name: fix-formatting
      group:
        piped: true
        jobs:
          - name: ruff-format
            glob: "*.py"
            run: uv run ruff format {staged_files}
            stage_fixed: true

          - name: ruff-check
            glob: "*.py"
            run: uv run ruff check --fix {staged_files}
            stage_fixed: true

          - name: trailing-whitespace
            run: uvx --from pre-commit-hooks trailing-whitespace-fixer {staged_files}
            stage_fixed: true

          - name: end-of-file-fixer
            run: uvx --from pre-commit-hooks end-of-file-fixer {staged_files}
            stage_fixed: true

    # -----------------------------------------------------------------
    # Stage 3: unit tests without coverage (fail-fast)
    #
    # Runs only when stages 1 and 2 pass. Coverage enforcement is
    # deferred to pre-push to keep commits fast.
    # Wall time: ~21s.
    # -----------------------------------------------------------------
    - name: pytest-check
      run: make test

# =============================================================================
# Pre-push: expensive whole-project validations (piped stages)
#
# Staged sequence with bounded parallelism: each stage runs only if the
# previous one passed. Gitleaks is the SOLE stdin consumer and runs first
# so it owns the git push stdin pipe; no other job sets use_stdin.
#
#   Stage 1  gitleaks (stdin) + static checks    (1 + 4 parallel)
#   Stage 2  pytest with coverage enforcement    (single)
#   Stage 3  property tests + sonar reports      (2 parallel)
#   Stage 4  mutation + safety + fuzz            (1 + 2 parallel)
# =============================================================================

pre-push:
  piped: true
  jobs:
    # Stage 1: Secret detection (sole stdin consumer) + static checks.
    # Gitleaks runs alone with use_stdin so it owns the git push stdin
    # pipe; no other job may set use_stdin.
    - name: gitleaks-detect
      run: make gitleaks
      use_stdin: true

    - name: static-checks
      group:
        parallel: true
        jobs:
          - name: agent-check
            run: make agent-check-no-tests
          - name: arch-check
            run: make arch-check
          - name: coupling-check
            run: make coupling-check
          - name: quality-ratchets
            run: make ratchets

    # Stage 2: Coverage
    - name: pytest-coverage
      run: make test-coverage

    # Stage 3: Property + advisory
    - name: property-and-advisory
      group:
        parallel: true
        jobs:
          - name: test-property
            run: make test-property-push
          - name: generate-sonar-reports
            run: make sonar-reports

    # Stage 4: Mutation + safety + fuzz (sequential, heavy)
    - name: mutate-diff
      run: make mutate-diff

    - name: safety-and-fuzz
      group:
        parallel: true
        jobs:
          - name: safety-scan
            run: make safety
          - name: fuzz-check
            run: make test-fuzz
