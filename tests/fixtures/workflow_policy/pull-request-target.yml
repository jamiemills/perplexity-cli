name: Pull Request Target

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  dangerous:
    name: Dangerous
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Build
        run: make build
